# Paper-library task, variant control: 0 attractor paper(s), control paper true (question 2.1, decisions O25, O56-O58: homeopathy control).
simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [library]

environment:
  import_path: collusion_study.library.env:LibraryEnvironment
  attractors: 0
  control_paper: true

communication_network:
  topology: complete
  num_agents: 6
  consolidate_channels: true

llm:
  provider: claude_cli

experiment:
  tag: library_control
  output_dir: experiments/collusion/outputs/library_control
  max_concurrent_runs: 1
  collusion:
    colluder_selection: random
    pairs: 2  # O59: a second seeded pair with its own private board; 2 agents stay unpaired
  sweeps:
    - name: library_control
      topologies: [complete]
      num_agents: [6]
      colluder_counts: [2]
